<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Yourself | Stopwatch & Timer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #0b1120, #172640);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 460px;
  background: #172238;
  border: 1px solid #293a58;
  border-radius: 25px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 20px 60px #0006;
}

h1 {
  color: #8b7cff;
  font-size: 34px;
  letter-spacing: 3px;
}

.subtitle {
  color: #9eacc5;
  margin-bottom: 28px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}

.tabs button {
  flex: 1;
  padding: 14px;
  background: #263653;
  color: white;
}

.tabs button.active {
  background: #806cff;
}

.display {
  font-size: clamp(34px, 9vw, 50px);
  font-weight: bold;
  font-variant-numeric: tabular-nums;
  margin: 30px 0;
}

.label {
  color: #9eacc5;
  font-size: 12px;
  letter-spacing: 3px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.buttons button {
  padding: 14px 20px;
  font-size: 14px;
}

.start {
  background: #806cff;
  color: white;
}

.reset {
  background: #30415e;
  color: white;
}

.lap {
  background: #13b8a6;
  color: white;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #405273;
  background: #0e192b;
  color: white;
  font-size: 18px;
  text-align: center;
  margin-bottom: 20px;
}

.laps {
  margin-top: 25px;
  text-align: left;
  max-height: 200px;
  overflow-y: auto;
}

.laps div {
  padding: 12px;
  border-bottom: 1px solid #30415e;
  display: flex;
  justify-content: space-between;
}

.hidden {
  display: none;
}

</style>
</head>

<body>

<div class="container">

<h1>Time Yourself</h1>
<p class="subtitle">Precision Timekeeping</p>

<div class="tabs">
<button id="stopwatchTab" class="active">STOPWATCH</button>
<button id="timerTab">TIMER</button>
</div>

<div id="stopwatch">

<p class="label">ELAPSED TIME</p>

<div class="display" id="watchDisplay">
00:00:00.00
</div>

<div class="buttons">
<button class="start" id="watchStart">START</button>
<button class="reset" id="watchReset">RESET</button>
<button class="lap" id="lapButton">LAP</button>
</div>

<div class="laps" id="laps"></div>

</div>

<div id="timer" class="hidden">

<p class="label">COUNTDOWN TIMER</p>

<div class="display" id="timerDisplay">
00:00:00
</div>

<input
type="number"
id="timerInput"
placeholder="Enter seconds"
min="1"
max="86400"
>

<div class="buttons">
<button class="start" id="timerStart">START</button>
<button class="reset" id="timerReset">RESET</button>
</div>

</div>

</div>

<script>

const stopwatchTab = document.getElementById("stopwatchTab");
const timerTab = document.getElementById("timerTab");

const stopwatch = document.getElementById("stopwatch");
const timer = document.getElementById("timer");

stopwatchTab.onclick = () => {
  stopwatch.classList.remove("hidden");
  timer.classList.add("hidden");

  stopwatchTab.classList.add("active");
  timerTab.classList.remove("active");
};

timerTab.onclick = () => {
  timer.classList.remove("hidden");
  stopwatch.classList.add("hidden");

  timerTab.classList.add("active");
  stopwatchTab.classList.remove("active");
};

// STOPWATCH

let elapsed = 0;
let startTime = 0;
let running = false;
let watchInterval = null;
let lapCount = 0;

const watchDisplay = document.getElementById("watchDisplay");

function formatWatch(ms) {
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor(ms / 60000) % 60;
  const seconds = Math.floor(ms / 1000) % 60;
  const centiseconds = Math.floor(ms / 10) % 100;

  return (
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0") + "." +
    String(centiseconds).padStart(2, "0")
  );
}

function updateWatch() {
  const current = elapsed +
    (running ? performance.now() - startTime : 0);

  watchDisplay.textContent = formatWatch(current);
}

document.getElementById("watchStart").onclick = () => {

  if (!running) {
    startTime = performance.now();
    running = true;

    watchInterval = setInterval(updateWatch, 10);

    document.getElementById("watchStart").textContent = "PAUSE";
  } else {
    elapsed += performance.now() - startTime;
    running = false;

    clearInterval(watchInterval);

    document.getElementById("watchStart").textContent = "START";
    updateWatch();
  }
};

document.getElementById("watchReset").onclick = () => {
  running = false;
  elapsed = 0;
  lapCount = 0;

  clearInterval(watchInterval);

  watchDisplay.textContent = "00:00:00.00";

  document.getElementById("watchStart").textContent = "START";
  document.getElementById("laps").innerHTML = "";
};

document.getElementById("lapButton").onclick = () => {
  if (!running) return;

  lapCount++;

  const current = elapsed + performance.now() - startTime;

  const lap = document.createElement("div");

  lap.innerHTML =
    `<span>Lap ${lapCount}</span>
     <span>${formatWatch(current)}</span>`;

  document.getElementById("laps").prepend(lap);
};

// TIMER

let remaining = 0;
let timerRunning = false;
let timerInterval = null;
let timerEnd = 0;

const timerDisplay = document.getElementById("timerDisplay");

function formatTimer(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor(seconds / 60) % 60;
  const secs = seconds % 60;

  return (
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0")
  );
}

function updateTimer() {
  remaining = Math.max(
    0,
    Math.ceil((timerEnd - Date.now()) / 1000)
  );

  timerDisplay.textContent = formatTimer(remaining);

  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerRunning = false;

    document.getElementById("timerStart").textContent = "START";

    alert("TIME IS UP! ⏰");
  }
}

document.getElementById("timerStart").onclick = () => {

  if (!timerRunning) {

    if (remaining <= 0) {
      const input = Number(
        document.getElementById("timerInput").value
      );

      if (!Number.isInteger(input) || input < 1 || input > 86400) {
        alert("Enter a number between 1 and 86400 seconds.");
        return;
      }

      remaining = input;
    }

    timerEnd = Date.now() + remaining * 1000;
    timerRunning = true;

    timerInterval = setInterval(updateTimer, 200);

    document.getElementById("timerStart").textContent = "PAUSE";

  } else {

    remaining = Math.max(
      0,
      Math.ceil((timerEnd - Date.now()) / 1000)
    );

    clearInterval(timerInterval);
    timerRunning = false;

    document.getElementById("timerStart").textContent = "START";

    timerDisplay.textContent = formatTimer(remaining);
  }
};

document.getElementById("timerReset").onclick = () => {
  clearInterval(timerInterval);

  timerRunning = false;
  remaining = 0;

  timerDisplay.textContent = "00:00:00";

  document.getElementById("timerStart").textContent = "START";
  document.getElementById("timerInput").value = "";
};

</script>

</body>
</html>
