<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIME YOURSELF</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #101426, #202c46);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: #182238;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    text-align: center;
}

h1 {
    font-size: 32px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9baac5;
    margin-bottom: 28px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
}

.tab {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #293752;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.tab.active {
    background: #477cff;
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

.display {
    font-size: clamp(38px, 10vw, 65px);
    font-weight: bold;
    letter-spacing: 2px;
    margin: 25px 0;
    font-variant-numeric: tabular-nums;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

button.action {
    border: none;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 15px;
    color: white;
    background: #477cff;
    cursor: pointer;
    transition: 0.2s;
}

button.action:hover {
    filter: brightness(1.15);
    transform: translateY(-2px);
}

button.secondary {
    background: #35435e;
}

button.danger {
    background: #e34e5b;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.laps {
    margin-top: 25px;
    text-align: left;
    max-height: 180px;
    overflow-y: auto;
}

.lap {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px;
    border-bottom: 1px solid #35435e;
    color: #cbd5e8;
}

.timer-inputs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 25px 0;
}

.input-group {
    width: 30%;
}

.input-group input {
    width: 100%;
    padding: 14px 5px;
    border: 2px solid #35435e;
    border-radius: 10px;
    background: #101a2c;
    color: white;
    font-size: 24px;
    text-align: center;
    outline: none;
}

.input-group input:focus {
    border-color: #477cff;
}

.input-group label {
    display: block;
    color: #9baac5;
    margin-top: 8px;
    font-size: 13px;
}

.progress-container {
    height: 9px;
    background: #35435e;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0;
}

.progress-bar {
    width: 100%;
    height: 100%;
    background: #477cff;
    transition: width 0.2s linear;
}

.message {
    min-height: 25px;
    color: #a9c4ff;
    margin-top: 15px;
    font-size: 15px;
}

footer {
    color: #71809b;
    font-size: 12px;
    margin-top: 30px;
}

[hidden] {
    display: none !important;
}

@media (max-width: 450px) {
    .container {
        padding: 22px 16px;
    }

    h1 {
        font-size: 27px;
    }

    button.action {
        padding: 12px 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>TIME YOURSELF</h1>
    <p class="subtitle">Your personal time management tool</p>

    <div class="tabs">
        <button class="tab active" onclick="showTab('stopwatch', this)">
            Stopwatch
        </button>

        <button class="tab" onclick="showTab('timer', this)">
            Timer
        </button>
    </div>

    <!-- STOPWATCH -->

    <section id="stopwatch" class="panel active">

        <div class="display" id="stopwatchDisplay">
            00:00:00.00
        </div>

        <div class="buttons">

            <button class="action" id="swStart" onclick="startStopwatch()">
                Start
            </button>

            <button class="action secondary" id="swPause"
                    onclick="pauseStopwatch()" disabled>
                Pause
            </button>

            <button class="action danger" onclick="resetStopwatch()">
                Reset
            </button>

            <button class="action secondary" onclick="recordLap()">
                Lap
            </button>

        </div>

        <div class="laps" id="laps"></div>

    </section>

    <!-- TIMER -->

    <section id="timer" class="panel">

        <div class="timer-inputs">

            <div class="input-group">
                <input type="number" id="hours"
                       min="0" max="99" step="1" value="0">
                <label>Hours</label>
            </div>

            <div class="input-group">
                <input type="number" id="minutes"
                       min="0" max="59" step="1" value="5">
                <label>Minutes</label>
            </div>

            <div class="input-group">
                <input type="number" id="seconds"
                       min="0" max="59" step="1" value="0">
                <label>Seconds</label>
            </div>

        </div>

        <div class="display" id="timerDisplay">
            00:05:00
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="buttons">

            <button class="action" id="timerStart"
                    onclick="startTimer()">
                Start
            </button>

            <button class="action secondary" id="timerPause"
                    onclick="pauseTimer()" disabled>
                Pause
            </button>

            <button class="action danger" onclick="resetTimer()">
                Reset
            </button>

            <button class="action danger" id="stopAlarm"
                    onclick="stopAlarm()" hidden>
                Stop Sound
            </button>

        </div>

        <p class="message" id="timerMessage"></p>

    </section>

    <footer>
        TIME YOURSELF · Make every second count.
    </footer>

</div>

<script>

/* =================================
   TAB SWITCHING
================================= */

function showTab(tabName, button) {
    document.querySelectorAll(".panel").forEach(panel => {
        panel.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document.getElementById(tabName).classList.add("active");
    button.classList.add("active");
}


/* =================================
   STOPWATCH
================================= */

let stopwatchStartTime = 0;
let stopwatchElapsed = 0;
let stopwatchInterval = null;
let lapCount = 0;
let previousLapTime = 0;

function formatStopwatch(ms) {
    let totalCentiseconds = Math.floor(ms / 10);

    let centiseconds = totalCentiseconds % 100;
    let totalSeconds = Math.floor(totalCentiseconds / 100);

    let seconds = totalSeconds % 60;
    let minutes = Math.floor(totalSeconds / 60) % 60;
    let hours = Math.floor(totalSeconds / 3600);

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") + "." +
        String(centiseconds).padStart(2, "0")
    );
}

function getStopwatchTime() {
    return stopwatchElapsed +
        (stopwatchInterval ? Date.now() - stopwatchStartTime : 0);
}

function updateStopwatch() {
    document.getElementById("stopwatchDisplay").textContent =
        formatStopwatch(getStopwatchTime());
}

function startStopwatch() {
    if (stopwatchInterval) return;

    stopwatchStartTime = Date.now();

    stopwatchInterval = setInterval(updateStopwatch, 10);

    document.getElementById("swStart").disabled = true;
    document.getElementById("swPause").disabled = false;
}

function pauseStopwatch() {
    if (!stopwatchInterval) return;

    stopwatchElapsed = getStopwatchTime();

    clearInterval(stopwatchInterval);
    stopwatchInterval = null;

    updateStopwatch();

    document.getElementById("swStart").disabled = false;
    document.getElementById("swPause").disabled = true;
}

function resetStopwatch() {
    clearInterval(stopwatchInterval);

    stopwatchInterval = null;
    stopwatchElapsed = 0;
    stopwatchStartTime = 0;
    lapCount = 0;
    previousLapTime = 0;

    document.getElementById("stopwatchDisplay").textContent =
        "00:00:00.00";

    document.getElementById("laps").innerHTML = "";

    document.getElementById("swStart").disabled = false;
    document.getElementById("swPause").disabled = true;
}

function recordLap() {
    let currentTime = getStopwatchTime();

    if (currentTime === 0) return;

    lapCount++;

    let lapTime = currentTime - previousLapTime;
    previousLapTime = currentTime;

    let lap = document.createElement("div");
    lap.className = "lap";

    let label = document.createElement("span");
    label.textContent = "Lap " + lapCount;

    let time = document.createElement("span");
    time.textContent = formatStopwatch(lapTime);

    lap.append(label, time);

    document.getElementById("laps").prepend(lap);
}


/* =================================
   TIMER VARIABLES
================================= */

let timerRemaining = 0;
let timerTotal = 0;
let timerInterval = null;
let timerEndTime = 0;
let timerFinished = false;


/* =================================
   TIMER FORMATTING
================================= */

function formatTimer(totalSeconds) {
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0")
    );
}

function getTimerInput() {
    function readValue(id, maximum) {
        let value = Number(document.getElementById(id).value);

        if (!Number.isFinite(value)) return 0;

        return Math.min(maximum, Math.max(0, Math.floor(value)));
    }

    let hours = readValue("hours", 99);
    let minutes = readValue("minutes", 59);
    let seconds = readValue("seconds", 59);

    return hours * 3600 + minutes * 60 + seconds;
}

function updateTimerDisplay() {
    document.getElementById("timerDisplay").textContent =
        formatTimer(timerRemaining);

    let percentage = timerTotal > 0
        ? (timerRemaining / timerTotal) * 100
        : 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";
}


/* =================================
   LIVE INPUT UPDATES
================================= */

function updateTimerFromInputs() {
    // Do not change the countdown while it is running
    // or after it has finished.
    if (timerInterval || timerFinished) return;

    timerRemaining = getTimerInput();
    timerTotal = timerRemaining;

    updateTimerDisplay();

    document.getElementById("timerMessage").textContent = "";
}

["hours", "minutes", "seconds"].forEach(id => {
    document.getElementById(id).addEventListener(
        "input",
        updateTimerFromInputs
    );
});


/* =================================
   START TIMER
================================= */

function startTimer() {
    if (timerInterval || timerFinished) return;

    if (timerRemaining <= 0) {
        timerRemaining = getTimerInput();
        timerTotal = timerRemaining;
    }

    if (timerRemaining <= 0) {
        document.getElementById("timerMessage").textContent =
            "Please enter a time greater than zero.";

        updateTimerDisplay();
        return;
    }

    // Prepare audio during the user's Start button interaction.
    prepareAudio();

    document.getElementById("timerMessage").textContent = "";

    timerEndTime = Date.now() + timerRemaining * 1000;

    timerInterval = setInterval(updateTimer, 100);

    document.getElementById("timerStart").disabled = true;
    document.getElementById("timerPause").disabled = false;
}


/* =================================
   TIMER COUNTDOWN
================================= */

function updateTimer() {
    timerRemaining = Math.max(
        0,
        Math.ceil((timerEndTime - Date.now()) / 1000)
    );

    updateTimerDisplay();

    if (timerRemaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;

        timerFinished = true;

        document.getElementById("timerStart").disabled = true;
        document.getElementById("timerPause").disabled = true;

        document.getElementById("timerMessage").textContent =
            "⏰ Time's up!";

        playAlarm();
    }
}


/* =================================
   PAUSE TIMER
================================= */

function pauseTimer() {
    if (!timerInterval) return;

    timerRemaining = Math.max(
        0,
        Math.ceil((timerEndTime - Date.now()) / 1000)
    );

    clearInterval(timerInterval);
    timerInterval = null;

    updateTimerDisplay();

    document.getElementById("timerStart").disabled = false;
    document.getElementById("timerPause").disabled = true;
}


/* =================================
   RESET TIMER
================================= */

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;

    stopAlarm();

    timerFinished = false;

    timerRemaining = getTimerInput();
    timerTotal = timerRemaining;

    updateTimerDisplay();

    document.getElementById("timerStart").disabled = false;
    document.getElementById("timerPause").disabled = true;

    document.getElementById("timerMessage").textContent = "";
}


/* =================================
   AUDIO SYSTEM
================================= */

let audioContext = null;
let alarmInterval = null;
let alarmOscillators = [];
let alarmActive = false;

function prepareAudio() {
    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) {
        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
    }
}

function playBeep(frequency, duration) {
    if (!alarmActive) return;

    if (!audioContext || audioContext.state !== "running") return;

    let oscillator = audioContext.createOscillator();
    let gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    let now = audioContext.currentTime;

    gain.gain.setValueAtTime(0.0001, now);

    gain.gain.exponentialRampToValueAtTime(
        0.25,
        now + 0.02
    );

    gain.gain.setValueAtTime(
        0.25,
        now + duration - 0.04
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    alarmOscillators.push(oscillator);

    oscillator.onended = () => {
        alarmOscillators =
            alarmOscillators.filter(item => item !== oscillator);

        oscillator.disconnect();
        gain.disconnect();
    };

    oscillator.start();
    oscillator.stop(now + duration);
}

function playAlarm() {
    prepareAudio();

    alarmActive = true;

    document.getElementById("stopAlarm").hidden = false;

    function beepSequence() {
        if (!alarmActive) return;

        playBeep(880, 0.22);

        setTimeout(() => {
            if (alarmActive) playBeep(660, 0.22);
        }, 300);

        setTimeout(() => {
            if (alarmActive) playBeep(880, 0.22);
        }, 600);
    }

    beepSequence();

    alarmInterval = setInterval(beepSequence, 1400);
}


/* =================================
   STOP ALARM
================================= */

function stopAlarm() {
    alarmActive = false;

    if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
    }

    alarmOscillators.forEach(oscillator => {
        try {
            oscillator.stop();
        } catch (error) {}
    });

    alarmOscillators = [];

    document.getElementById("stopAlarm").hidden = true;
}


/* =================================
   INITIAL SETUP
================================= */

timerRemaining = getTimerInput();
timerTotal = timerRemaining;

updateTimerDisplay();

</script>

</body>
</html>
