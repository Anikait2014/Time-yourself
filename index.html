<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIME YOURSELF</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101321;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    background: #191e32;
    border-bottom: 1px solid #303852;
}

header h1 {
    font-size: 27px;
    letter-spacing: 2px;
}

header h1 span {
    color: #8d79ff;
}

header p {
    color: #9ba3bb;
    margin-top: 7px;
    font-size: 13px;
}

.container {
    width: 92%;
    max-width: 650px;
    margin: 35px auto;
}

.tabs {
    display: flex;
    background: #1b2034;
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: #aab1c8;
    border-radius: 9px;
    font-size: 15px;
    cursor: pointer;
}

.tab.active {
    background: #7964ed;
    color: white;
}

.panel {
    background: #1b2034;
    border: 1px solid #303852;
    border-radius: 18px;
    padding: 30px 20px;
    text-align: center;
}

.panel h2 {
    font-size: 20px;
    margin-bottom: 25px;
}

.display {
    font-size: clamp(38px, 10vw, 65px);
    font-weight: bold;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    margin: 25px 0;
    color: #ffffff;
}

.milliseconds {
    font-size: 0.48em;
    color: #9b8cff;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 25px;
}

button {
    cursor: pointer;
}

.action {
    padding: 13px 22px;
    border: none;
    border-radius: 9px;
    background: #303852;
    color: white;
    font-size: 14px;
    min-width: 90px;
}

.action:hover {
    filter: brightness(1.2);
}

.start {
    background: #7964ed;
}

.reset {
    background: #bd4960;
}

.lap {
    background: #278b91;
}

.timer-inputs {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 30px 0;
}

.input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.input-group label {
    font-size: 12px;
    color: #aab1c8;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.input-group input {
    width: 95px;
    height: 75px;
    border: 1px solid #424a68;
    border-radius: 12px;
    background: #111629;
    color: white;
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    outline: none;
}

.input-group input:focus {
    border-color: #8d79ff;
}

.separator {
    font-size: 30px;
    font-weight: bold;
    margin-top: 25px;
    color: #8d79ff;
}

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

input[type=number] {
    appearance: textfield;
    -moz-appearance: textfield;
}

.timer-status {
    color: #aab1c8;
    font-size: 13px;
    margin-top: 18px;
    min-height: 18px;
}

.progress-container {
    height: 7px;
    background: #303852;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 25px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #8d79ff;
    transition: width 0.2s linear;
}

.laps {
    margin-top: 30px;
    text-align: left;
}

.laps h3 {
    font-size: 15px;
    margin-bottom: 12px;
}

.lap-list {
    list-style: none;
    max-height: 180px;
    overflow-y: auto;
}

.lap-list li {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid #303852;
    color: #c2c8da;
    font-size: 14px;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    color: #77809c;
    font-size: 12px;
    padding: 20px;
}

@media(max-width: 420px) {
    .panel {
        padding: 25px 12px;
    }

    .input-group input {
        width: 75px;
        height: 65px;
        font-size: 25px;
    }

    .timer-inputs {
        gap: 7px;
    }

    .action {
        padding: 12px 15px;
        min-width: 80px;
    }
}
</style>
</head>

<body>

<header>
    <h1>TIME <span>YOURSELF</span></h1>
    <p>Your personal stopwatch and timer</p>
</header>

<div class="container">

    <div class="tabs">
        <button class="tab active" id="stopwatchTab">
            ⏱ Stopwatch
        </button>

        <button class="tab" id="timerTab">
            ⏳ Timer
        </button>
    </div>

    <!-- STOPWATCH -->

    <section class="panel" id="stopwatchPanel">

        <h2>Stopwatch</h2>

        <div class="display" id="stopwatchDisplay">
            00:00<span class="milliseconds">.00</span>
        </div>

        <div class="buttons">
            <button class="action start" id="swStart">Start</button>
            <button class="action" id="swPause">Pause</button>
            <button class="action reset" id="swReset">Reset</button>
            <button class="action lap" id="swLap">Lap</button>
        </div>

        <div class="laps">
            <h3>Lap Times</h3>
            <ul class="lap-list" id="lapList"></ul>
        </div>

    </section>

    <!-- TIMER -->

    <section class="panel hidden" id="timerPanel">

        <h2>Set Your Timer</h2>

        <div class="timer-inputs">

            <div class="input-group">
                <label for="hours">Hours</label>
                <input type="number" id="hours"
                       min="0" max="99" value="0"
                       inputmode="numeric">
            </div>

            <div class="separator">:</div>

            <div class="input-group">
                <label for="minutes">Minutes</label>
                <input type="number" id="minutes"
                       min="0" max="59" value="5"
                       inputmode="numeric">
            </div>

            <div class="separator">:</div>

            <div class="input-group">
                <label for="seconds">Seconds</label>
                <input type="number" id="seconds"
                       min="0" max="59" value="0"
                       inputmode="numeric">
            </div>

        </div>

        <div class="display" id="timerDisplay">
            00:05:00
        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="buttons">
            <button class="action start" id="timerStart">Start</button>
            <button class="action" id="timerPause">Pause</button>
            <button class="action reset" id="timerReset">Reset</button>
        </div>

        <div class="timer-status" id="timerStatus">
            Ready to start
        </div>

    </section>

</div>

<footer>
    TIME YOURSELF © 2026
</footer>

<script>

// ================================
// TAB SWITCHING
// ================================

const stopwatchTab = document.getElementById("stopwatchTab");
const timerTab = document.getElementById("timerTab");

const stopwatchPanel = document.getElementById("stopwatchPanel");
const timerPanel = document.getElementById("timerPanel");

stopwatchTab.addEventListener("click", () => {
    stopwatchPanel.classList.remove("hidden");
    timerPanel.classList.add("hidden");

    stopwatchTab.classList.add("active");
    timerTab.classList.remove("active");
});

timerTab.addEventListener("click", () => {
    timerPanel.classList.remove("hidden");
    stopwatchPanel.classList.add("hidden");

    timerTab.classList.add("active");
    stopwatchTab.classList.remove("active");
});


// ================================
// STOPWATCH
// ================================

let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swInterval = null;

const swDisplay = document.getElementById("stopwatchDisplay");

function formatStopwatch(ms) {
    let totalCentiseconds = Math.floor(ms / 10);

    let minutes = Math.floor(totalCentiseconds / 6000);
    let seconds = Math.floor(totalCentiseconds / 100) % 60;
    let centiseconds = totalCentiseconds % 100;

    return (
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0") +
        '<span class="milliseconds">.' +
        String(centiseconds).padStart(2, "0") +
        '</span>'
    );
}

function updateStopwatch() {
    let current = swElapsed;

    if (swRunning) {
        current += performance.now() - swStartTime;
    }

    swDisplay.innerHTML = formatStopwatch(current);
}

document.getElementById("swStart").addEventListener("click", () => {
    if (swRunning) return;

    swRunning = true;
    swStartTime = performance.now();

    swInterval = setInterval(updateStopwatch, 10);
});

document.getElementById("swPause").addEventListener("click", () => {
    if (!swRunning) return;

    swElapsed += performance.now() - swStartTime;
    swRunning = false;

    clearInterval(swInterval);
    updateStopwatch();
});

document.getElementById("swReset").addEventListener("click", () => {
    swRunning = false;
    clearInterval(swInterval);

    swElapsed = 0;
    swDisplay.innerHTML = formatStopwatch(0);

    document.getElementById("lapList").innerHTML = "";
});

document.getElementById("swLap").addEventListener("click", () => {
    if (!swRunning && swElapsed === 0) return;

    let current = swElapsed;

    if (swRunning) {
        current += performance.now() - swStartTime;
    }

    let lap = document.createElement("li");

    lap.innerHTML =
        "<span>Lap " +
        (document.getElementById("lapList").children.length + 1) +
        "</span><span>" +
        formatStopwatch(current).replace(/<[^>]*>/g, "") +
        "</span>";

    document.getElementById("lapList").prepend(lap);
});


// ================================
// TIMER
// ================================

const hoursInput = document.getElementById("hours");
const minutesInput = document.getElementById("minutes");
const secondsInput = document.getElementById("seconds");

const timerDisplay = document.getElementById("timerDisplay");
const timerStatus = document.getElementById("timerStatus");
const progress = document.getElementById("progress");

let timerRunning = false;
let timerInterval = null;
let timerEndTime = 0;
let remainingSeconds = 0;
let originalSeconds = 0;

function getTimerInput() {
    let h = Math.min(99, Math.max(0, Number(hoursInput.value) || 0));
    let m = Math.min(59, Math.max(0, Number(minutesInput.value) || 0));
    let s = Math.min(59, Math.max(0, Number(secondsInput.value) || 0));

    hoursInput.value = h;
    minutesInput.value = m;
    secondsInput.value = s;

    return h * 3600 + m * 60 + s;
}

function formatTimer(total) {
    total = Math.max(0, Math.ceil(total));

    let h = Math.floor(total / 3600);
    let m = Math.floor((total % 3600) / 60);
    let s = total % 60;

    return (
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0")
    );
}

function updateTimerDisplay() {
    timerDisplay.textContent = formatTimer(remainingSeconds);

    let percentage = originalSeconds > 0
        ? ((originalSeconds - remainingSeconds) / originalSeconds) * 100
        : 0;

    progress.style.width = percentage + "%";
}

function stopTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    timerInterval = null;
}

function timerTick() {
    remainingSeconds = Math.max(
        0,
        (timerEndTime - Date.now()) / 1000
    );

    updateTimerDisplay();

    if (remainingSeconds <= 0) {
        remainingSeconds = 0;

        stopTimer();
        updateTimerDisplay();

        timerStatus.textContent = "⏰ Time's up!";
        progress.style.width = "100%";

        alert("Time's up!");

    }
}

function startTimer() {
    if (timerRunning) return;

    if (remainingSeconds <= 0) {
        remainingSeconds = getTimerInput();
        originalSeconds = remainingSeconds;
    }

    if (remainingSeconds <= 0) {
        timerStatus.textContent = "Please enter a time first.";
        return;
    }

    timerEndTime = Date.now() + remainingSeconds * 1000;

    timerRunning = true;
    timerStatus.textContent = "Timer running...";

    clearInterval(timerInterval);

    timerInterval = setInterval(timerTick, 100);
    timerTick();
}

function pauseTimer() {
    if (!timerRunning) return;

    remainingSeconds = Math.max(
        0,
        (timerEndTime - Date.now()) / 1000
    );

    stopTimer();

    timerStatus.textContent = "Timer paused";
    updateTimerDisplay();
}

function resetTimer() {
    stopTimer();

    remainingSeconds = getTimerInput();
    originalSeconds = remainingSeconds;

    timerStatus.textContent = "Ready to start";

    updateTimerDisplay();
}

document.getElementById("timerStart")
    .addEventListener("click", startTimer);

document.getElementById("timerPause")
    .addEventListener("click", pauseTimer);

document.getElementById("timerReset")
    .addEventListener("click", resetTimer);

// Update timer preview when inputs change

[hoursInput, minutesInput, secondsInput].forEach(input => {
    input.addEventListener("change", () => {
        if (!timerRunning) {
            resetTimer();
        }
    });
});

// Initial display

resetTimer();

</script>

</body>
</html>
